name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "script/**"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "script/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install integration-test dependencies
        run: sudo apt-get update && sudo apt-get install -y nginx openssl
      - name: Check shell syntax and legacy WSS generator
        run: |
          for script in script/*.sh; do bash -n "$script"; done
          bash script/test-wss-proxy.sh
      - name: Test lifecycle manager and real multi-domain WSS routing
        run: python3 -m unittest discover -s script -p 'test_*.py' -v
  go:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
      GOEXPERIMENT: jsonv2
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Verify release build
        shell: bash
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags "-X 'github.com/fsh2502/v2nodePro/cmd.version=${GITHUB_SHA}' -s -w -buildid=" \
            -o dist/v2node .
